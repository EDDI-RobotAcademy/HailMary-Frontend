name: Deploy Frontend to S3 + CloudFront

on:
  workflow_dispatch:
# NOTE: 자동 push 트리거 제거 — prod 배포는 항상 수동(workflow_dispatch)으로만.
# staging은 main push 시 자동 배포되어 검증 → 검증 끝나면 GitHub UI에서 prod 워크플로 수동 실행.

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, hailmary-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_AMPLITUDE_API_KEY: ${{ secrets.NEXT_PUBLIC_AMPLITUDE_API_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_KAKAO_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_KAKAO_CLIENT_ID }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          # 카드사 심사용 테스트 로그인 버튼 노출 (HM-FE-136). 심사 종료 후 secret=false 재배포로 숨김.
          NEXT_PUBLIC_TEST_LOGIN_ENABLED: ${{ secrets.NEXT_PUBLIC_TEST_LOGIN_ENABLED }}
          # 이미지 최적화 콘텐츠 해시 캐시 (HM-FE-104) — self-hosted EC2 영구 경로.
          # 작업 디렉터리(_work) 밖이라 checkout/빌드와 무관하게 persist → 안 바뀐 이미지 sharp 스킵.
          IMAGE_CACHE_DIR: /home/ec2-user/.kkebi-image-cache

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Sync assets to S3 (long cache)
        run: |
          aws s3 sync out/ s3://${{ secrets.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" --exclude "*.txt" --exclude "*.json"

      - name: Sync HTML to S3 (no cache)
        run: |
          aws s3 sync out/ s3://${{ secrets.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --exclude "*" --include "*.html" --include "*.txt" --include "*.json"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
